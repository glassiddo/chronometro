<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chronometro</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <div>
          <p class="kicker">Paris daily route puzzle</p>
          <button class="home-title" id="homeButton" type="button" aria-label="Restart Chronometro">
            Chronometro
          </button>
          <p class="objective">Build the fastest route from departure to arrival.</p>
        </div>
        <div class="date-lockup">
          <span id="todayLabel"></span>
          <strong id="roundLabel">1 / 5</strong>
        </div>
      </header>

      <section id="game" class="game" aria-live="polite"></section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
