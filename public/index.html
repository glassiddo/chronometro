<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A daily transit route puzzle. Plan the fastest route from one station to another" />
    <title>Chronométro</title>
    <link rel="icon" href="./favicon.svg?v=20260818" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css?v=20260913-desktop-fit" />
  </head>
  <body>
    <a class="skip-link" href="#game">Skip to game</a>
    <main class="shell">
      <header class="masthead">
        <div>
          <p class="kicker" id="cityKicker">Daily route puzzle</p>
          <button class="home-title" id="homeButton" type="button" aria-label="Restart Chronométro">
            Chronométro
          </button>
          <p class="objective">Plan the fastest route from one station to another</p>
        </div>
        <div class="date-lockup">
          <button class="game-switcher" id="gameSwitcher" type="button" aria-label="Change game">
            <span>Playing</span>
            <strong id="currentGameLabel">Paris · Easy</strong>
            <em>Change</em>
          </button>
          <span id="todayLabel"></span>
          <strong id="roundLabel">1 / 5</strong>
        </div>
      </header>

      <section id="game" class="game"></section>

      <footer class="site-footer">
        <nav aria-label="Project information">
          <a href="./faq.html">FAQ</a>
          <a href="./rules.html">Rules</a>
          <a href="./legal.html">About</a>
        <a href="./feedback.html" data-feedback-link target="_blank" rel="noopener">Report a problem ↗</a></nav>
        <p>Chronométro is independent and is not endorsed by the transport operators or data providers represented in the game.</p>
      </footer>
    </main>

    <script src="./app.js?v=20260913-game-switcher"></script>
  </body>
</html>
